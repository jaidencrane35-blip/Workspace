[package]
name = "workspace-windows-integration"
description = "Windows Integration Layer — OS API abstraction (DEC-008)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "workspace_windows_integration"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
workspace-domain = { workspace = true }
arboard = "3"
webbrowser = "1"
xcap = { version = "0.9", features = ["image"] }
image = "0.25"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_SpeechRecognition",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
tauri-winrt-notification = "0.7"

[dev-dependencies]
serde_json = { workspace = true }
