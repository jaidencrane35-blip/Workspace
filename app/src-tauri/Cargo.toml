[package]
name = "workspace-app"
version = "0.1.0"
description = "Workspace desktop application shell"
edition = "2021"
publish = false

[lib]
name = "workspace_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "workspace-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = { workspace = true }
env_logger = "0.11"
tauri = { version = "2", features = [] }
workspace-database = { path = "../../packages/database" }
workspace-kernel = { path = "../../packages/kernel" }
workspace-domain = { path = "../../packages/domain" }
workspace-windows-integration = { path = "../../packages/windows-integration" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
