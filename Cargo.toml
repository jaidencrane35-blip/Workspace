[workspace]
resolver = "2"
members = [
  "app/src-tauri",
  "packages/database",
  "packages/kernel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Workspace Contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
workspace-database = { path = "packages/database" }
workspace-kernel = { path = "packages/kernel" }
